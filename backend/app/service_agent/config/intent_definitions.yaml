# Intent Definitions - Description 기반 설정
# 이 파일을 수정하면 Intent 분석 로직이 자동으로 업데이트됩니다.

intents:
  # 1. 용어설명
  - name: TERM_DEFINITION
    display_name: "용어설명"
    description: |
      부동산 전문 용어, 개념의 단순 설명 요청.
      사용자가 특정 용어의 의미, 정의, 다른 용어와의 차이를 알고 싶어함.
    category: "검색"
    tools:
      - real_estate_terminology
    agents:
      - search_team
    question_patterns:
      - "~가 뭐야?"
      - "~의 의미는?"
      - "~와 ~의 차이는?"
      - "~란 무엇인가?"
      - "~에 대해 설명해줘"
    examples:
      - "LTV가 뭐야? 대출받을 때 중요한 개념인가?"
      - "대항력이 뭔가요? 전세 계약할 때 필요한 건가요?"
      - "분양권과 입주권의 차이는? 어떤 걸 사야 하나요?"
      - "재건축과 재개발 차이 알려줘. 투자할 때 뭐가 유리해?"
      - "DSR이 뭔지 설명해주세요"
    complexity: low
    requires_analysis: false
    enabled: true
    priority: 1

  # 2. 법률해설
  - name: LEGAL_INQUIRY
    display_name: "법률해설"
    description: |
      부동산 관련 법률 적용, 해석, 권리/의무 질문 및 계약 절차 관련 법적 요건.
      임대차보호법, 계약 갱신, 보증금 인상 제한 등 법적 가능 여부 판단.
    category: "검색"
    tools:
      - legal_search_tool
    agents:
      - search_team
    question_patterns:
      - "~할 수 있나요?"
      - "법적으로 가능한가요?"
      - "~법에서는?"
      - "권리/의무"
      - "계약 관련"
    examples:
      - "집주인이 전세금 5% 이상 올리겠다는데 가능한가요?"
      - "2년 살았는데 임대인이 계약 갱신 거부할 수 있나요?"
      - "주택임대차보호법에서 전세금 인상 한도가 얼마로 정해져 있어요?"
      - "전월세 계약할 때 확정일자 꼭 받아야 하나요?"
      - "관리비를 체납하면 어떤 법적 조치를 받나요?"
    complexity: medium
    requires_analysis: true
    analysis_keywords:
      - "비교"
      - "분석"
      - "계산"
      - "평가"
      - "추천"
      - "검토"
      - "어떻게"
      - "방법"
      - "차이"
      - "장단점"
      - "괜찮아"
      - "해야"
      - "대응"
      - "해결"
      - "조치"
      - "문제"
    enabled: true
    priority: 2

  # 3. 대출상품검색
  - name: LOAN_SEARCH
    display_name: "대출상품검색"
    description: |
      주택담보대출, 전세자금대출 등 대출 상품 검색.
      특정 대출 상품의 존재 여부나 종류를 찾는 경우.
    category: "검색"
    tools:
      - loan_data_tool
    agents:
      - search_team
    question_patterns:
      - "대출 상품 어떤 게"
      - "~대출 있어요?"
      - "대출 찾아줘"
    examples:
      - "전세자금대출 상품 어떤 게 있어요? 은행별로 알려주세요"
      - "주택담보대출 상품 찾아줘. 4억 집 살 때 받을 수 있는 거"
      - "신생아 특례대출이 뭐예요? 조건이랑 금리 알려주세요"
      - "청년 전세대출 상품 있나요?"
    complexity: low
    requires_analysis: false
    enabled: true
    priority: 3

  # 4. 대출조건비교
  - name: LOAN_COMPARISON
    display_name: "대출조건비교"
    description: |
      여러 대출 상품의 조건, 금리, 한도 비교 분석.
      은행별 대출 조건을 비교하거나 최적 대출 상품을 찾는 경우.
    category: "검색+분석"
    tools:
      - loan_simulator_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "비교해줘"
      - "어느 은행이"
      - "어디가 유리"
      - "금리 비교"
    examples:
      - "KB국민, 신한, 우리은행 주택담보대출 금리 비교해줘"
      - "연봉 5천만원인데 전세자금대출 얼마까지 받을 수 있어요?"
      - "DSR 40% 규제 적용받는데 어느 은행이 한도가 높아요?"
      - "보금자리론이랑 시중은행 대출 중 어떤 게 유리한가요?"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 4

  # 5. 건축물대장조회
  - name: BUILDING_REGISTRY
    display_name: "건축물대장조회"
    description: |
      건축물대장 API 조회 요청.
      특정 건물의 건축물대장 정보를 확인하는 경우.
    category: "검색"
    tools:
      - building_registry_tool
    agents:
      - search_team
    question_patterns:
      - "건축물대장"
      - "건물정보"
      - "준공일자"
      - "용도/면적 조회"
    examples:
      - "서울 강남구 테헤란로 123 건물 건축물대장 조회해줘"
      - "이 빌라 불법 증축 있는지 건축물대장으로 확인 가능해?"
      - "건물 준공일자가 언제인지 건축물대장에서 확인해주세요"
      - "주차장 면적이랑 세대수 건축물대장에 어떻게 나와있어요?"
    complexity: low
    requires_analysis: false
    enabled: true
    priority: 5

  # 6. 매물인프라분석
  - name: PROPERTY_INFRA_ANALYSIS
    display_name: "매물인프라분석"
    description: |
      특정 위치/아파트 주변의 지하철역, 마트, 병원, 약국, 초중고 등 인프라 정보 조회.
      주변 편의시설, 교통, 학군 등을 분석하는 경우.
    category: "검색+분석"
    tools:
      - infrastructure_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "근처/주변"
      - "인프라"
      - "지하철/마트/병원/학교"
      - "도보권"
      - "학군"
    examples:
      - "강남역 근처 대치초등학교가 있는 매물 확인해줘"
      - "에버그린아파트 근처 인프라 무엇이 있는지 알려줘"
      - "송파구 매물 중에 도보 10분 이내 지하철역이 있는 매물 알려줘"
      - "학군 좋은 동네를 알려줘. 초등학교 중학교가 가까운 곳"
      - "아이 키우기 좋은지 근처 초중고 학교 분포 확인해줘"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 6

  # 7. 가격평가
  - name: PRICE_EVALUATION
    display_name: "가격평가"
    description: |
      유사 매물 대비 가격 적정성 평가.
      특정 매물의 가격이 합리적인지 판단하는 경우.
    category: "검색+분석"
    tools:
      - market_analysis_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "적정한가요?"
      - "가격 괜찮아?"
      - "비싼가요?"
      - "저렴한가요?"
      - "합리적"
    examples:
      - "강남구 대치동 은마아파트 84㎡ 매매가 15억인데 적정한가요?"
      - "같은 평수 비슷한 층 매물이랑 비교했을 때 이 가격 비싼가요?"
      - "주변 아파트 시세 대비 이 집 전세 3억이 합리적인지 평가해줘"
      - "유사 조건 매물보다 1억 높게 나왔는데 적정가인가요?"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 7

  # 8. 매물검색
  - name: PROPERTY_SEARCH
    display_name: "매물검색"
    description: |
      특정 조건의 부동산 매물 검색 요청.
      구체적인 조건(가격, 위치, 평수 등)으로 매물을 찾는 경우.
    category: "검색+분석"
    tools:
      - real_estate_search_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "찾아줘"
      - "검색해줘"
      - "구하다"
      - "매물 있어?"
    examples:
      - "강남구 3억 이하 전세 아파트 찾아줘. 방 2개 이상 필요해"
      - "서울대입구역 도보 10분 거리에 월세 50만원 이하 원룸 있어?"
      - "판교 신도시 아파트 중에서 4억대 매매가 84㎡ 검색해줘"
      - "성수동 오피스텔 전세 2억 이하로 나온 매물 리스트 보여줘"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 8

  # 9. 맞춤추천
  - name: PROPERTY_RECOMMENDATION
    display_name: "맞춤추천"
    description: |
      사용자 조건/선호도 기반 매물 추천 요청.
      추상적인 조건이나 라이프스타일 기반으로 추천받는 경우.
    category: "검색+분석"
    tools:
      - real_estate_search_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "추천해줘"
      - "나한테 맞는"
      - "좋은 곳"
      - "어디가 좋을까"
    examples:
      - "나한테 맞는 집 추천해줘. 직장 강남이고 조용한 곳 좋아해"
      - "예산 4억으로 투자 수익 나올 만한 지역 어디가 좋아요?"
      - "신혼부부 둘이 살기 좋은 아파트 추천해주세요. 편의시설 중요해요"
      - "첫 집 마련하려는데 3억 전세로 직장 접근성 좋은 곳 어디가 좋을까요?"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 9

  # 10. 투자수익률계산
  - name: ROI_CALCULATION
    display_name: "투자수익률계산"
    description: |
      투자 수익률, ROI 계산 요청.
      부동산 투자의 수익성을 계산하는 경우.
    category: "분석"
    tools:
      - roi_calculator_tool
    agents:
      - analysis_team
    question_patterns:
      - "수익률"
      - "ROI"
      - "투자 계산"
      - "수익 얼마"
    examples:
      - "5억 아파트 사서 월세 150만원 받으면 수익률이 얼마나 돼요?"
      - "매매가 3억인 오피스텔 전세 2억으로 놓으면 투자 수익률 계산해줘"
      - "5억짜리 집 매매할까 3억 전세 끼고 2억으로 투자할까?"
      - "강남 아파트 월세 수익률이랑 판교 수익률 비교 계산해주세요"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 10

  # 11. 정부정책조회
  - name: POLICY_INQUIRY
    display_name: "정부정책조회"
    description: |
      정부 지원 정책, 세제 혜택 관련 질문.
      청약, 특별공급, 대출 지원 등 정부 정책을 찾는 경우.
    category: "검색+분석"
    tools:
      - policy_matcher_tool
    agents:
      - search_team
      - analysis_team
    question_patterns:
      - "특별공급"
      - "정부 지원"
      - "정책"
      - "혜택"
      - "청약"
    examples:
      - "생애최초 특별공급 자격 조건이 뭐예요? 소득 기준 있나요?"
      - "신혼부부 대상 정부 지원 정책 어떤 거 있어요?"
      - "청년 전월세 대출 받을 수 있는 조건 뭐예요?"
      - "다자녀 가구 혜택 어떤 게 있어요?"
    complexity: medium
    requires_analysis: true
    enabled: true
    priority: 11

  # 12. 계약서생성
  - name: CONTRACT_CREATION
    display_name: "계약서생성"
    description: |
      새로운 임대차계약서 작성 요청.
      계약서를 만들거나 작성하는 경우.
    category: "문서생성"
    tools:
      - lease_contract_generator_tool
    agents:
      - document_team
    question_patterns:
      - "계약서 작성"
      - "계약서 만들"
      - "계약서 생성"
      - "양식"
    examples:
      - "전세 보증금 2억으로 임대차계약서 작성해주세요. 기간은 2년이요"
      - "월세 보증금 1천, 월세 60만원으로 계약서 만들어주세요"
      - "상가 임대차계약서 초안 생성 부탁해요"
      - "전세계약서 양식 필요한데 특약사항도 넣어서 만들어주세요"
    complexity: medium
    requires_analysis: false
    enabled: true
    priority: 12

  # 13. 시세트렌드분석
  - name: MARKET_INQUIRY
    display_name: "시세트렌드분석"
    description: |
      지역별 시세 트렌드, 거래 동향 분석.
      시세 변화나 시장 추이를 파악하는 경우.
    category: "검색+분석"
    tools:
      - market_analysis_tool
    agents:
      - search_team
    question_patterns:
      - "시세"
      - "트렌드"
      - "올랐나요"
      - "떨어졌나요"
      - "거래 동향"
    examples:
      - "강남구 아파트 전세 시세 최근 6개월 동안 얼마나 올랐나요?"
      - "서초동 래미안아파트 84㎡ 매매가 작년 대비 얼마나 변했어요?"
      - "송파구 거래량이 늘었다는데 전월 대비 몇 퍼센트 증가했나요?"
      - "요즘 서울 전세 시장 분위기 어때요?"
    complexity: medium
    requires_analysis: true
    analysis_keywords:
      - "비교"
      - "분석"
      - "평가"
      - "추천"
      - "차이"
      - "장단점"
    enabled: true
    priority: 13

  # 14. 종합분석
  - name: COMPREHENSIVE
    display_name: "종합분석"
    description: |
      여러 측면의 종합 분석이 필요하거나 복잡한 상황에 대한 해결책 요청.
      3개 이상의 다른 도구가 필요하거나 복잡한 의사결정 지원이 필요한 경우.
      연속 대화에서 임대차 유지보수 문제(수도, 보일러, 벽지 등)도 포함.
    category: "종합처리"
    tools:
      - multiple
    agents:
      - search_team
      - analysis_team
      - document_team
    question_patterns:
      - "종합적으로"
      - "어떻게 해야"
      - "고민인데"
      - "다각도로"
      - "전체적으로"
    examples:
      - "강남에서 자취방 구하는데 교통 좋고 안전한 곳 추천해줘. 대출도 받아야 하는데"
      - "이 아파트 매매할까 전세 낄까 고민인데, 주변 시세도 보고 투자 가치도 분석해줘"
      - "전세 계약 만료인데 집주인이 보증금 2배 올려달래. 법적으로 문제없는지 확인하고 대응 방법 알려줘"
      - "신혼집 구하는데 예산 5억으로 어느 지역이 좋을까? 학군, 개발계획, 시세 상승 가능성 다 고려해줘"
    complexity: high
    requires_analysis: true
    enabled: true
    priority: 14

  # 15. 무관
  - name: IRRELEVANT
    display_name: "무관"
    description: |
      부동산과 전혀 관련 없는 질문.
